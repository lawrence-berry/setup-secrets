name: Linux

on:
  pull_request:
    paths-ignore: [ "**.md" ]
  push:
    branches: [main]
    paths-ignore: [ "**.md" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning -e SC2148 *.sh

  install:
    name: Install (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh twice in a scratch HOME
        run: |
          export HOME="$(mktemp -d)" SHELL=/bin/bash
          ./install.sh
          ./install.sh
          [ "$(grep -c '# setup-secrets' "$HOME/.bashrc")" -eq 1 ]
          [ "$(stat -c %a "$HOME/.secrets/secrets.sh" 2>/dev/null || stat -f %Lp "$HOME/.secrets/secrets.sh")" = 600 ]
